name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'migration/**'
  pull_request:
    branches:
      - main
      - 'phase/**'
      - 'migration/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check

  database:
    name: Database regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start isolated database and apply migrations
        run: supabase db start
      - name: Run database tests
        run: supabase test db supabase/tests/database/*.test.sql
      - name: Stop isolated database
        if: always()
        run: supabase stop --no-backup

  d1-schema:
    name: D1 schema invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQLite/D1 core auth rules
        run: python3 -m unittest discover -s cloudflare/d1 -p 'test_*.py'
